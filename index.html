<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空駆ける天馬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Layout: full-viewport stage. Player fills the left, playlist sits in a right rail (below the player on phones). */
  :root {
    --bg: #0b111c;
    --panel: #121a29;
    --panel-hover: #18233a;
    --fg: #e8edf6;
    --muted: #8f9bb1;
    --line: #223049;
    --accent: #8fb2f0;
    --stage: #000;
    --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, .item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .app {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    grid-template-rows: minmax(0, 1fr);
  }
  .app.list-hidden { grid-template-columns: minmax(0, 1fr) 0; }
  .app.list-hidden .rail { visibility: hidden; border-left: 0; }

  .stage {
    position: relative;
    background: var(--stage);
    min-width: 0;
    min-height: 0;
  }
  #player, .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .rail {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--panel);
    border-left: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  .rail-head {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow { margin: 0; font-size: 11px; letter-spacing: 0.18em; color: var(--muted); }
  h1 {
    margin: 2px 0 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.06em;
    line-height: 1.3;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
  }
  .btn {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    line-height: 1.4;
  }
  .btn:hover { background: var(--panel-hover); }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

  .list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
  .item {
    display: grid;
    grid-template-columns: 22px 120px minmax(0, 1fr);
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 18px;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    text-align: left;
  }
  .item:hover { background: var(--panel-hover); }
  .item .no { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
  .item img { width: 120px; max-width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; border-radius: 3px; display: block; }
  .item .t { display: block; font-weight: 500; overflow-wrap: anywhere; }
  .item .b { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .item[aria-current="true"] { background: var(--panel-hover); box-shadow: inset 3px 0 0 var(--accent); }
  .item[aria-current="true"] .no { color: var(--accent); }

  .status { padding: 12px 18px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .status strong { color: var(--fg); font-weight: 500; }
  .status a { color: var(--accent); text-underline-offset: 3px; }

  /* Floating button to bring the list back when it is hidden */
  .show-list {
    position: absolute;
    top: 12px;
    right: calc(12px + env(safe-area-inset-right, 0px));
    z-index: 5;
    background: rgba(11, 17, 28, 0.82);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 14px;
    font-size: 13px;
    display: none;
  }
  .app.list-hidden .show-list { display: block; }

  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .app.list-hidden { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 0; }
    .stage { aspect-ratio: 16 / 9; padding-top: env(safe-area-inset-top, 0px); }
    .app.list-hidden .stage { aspect-ratio: auto; }
    .rail { border-left: 0; border-top: 1px solid var(--line); }
    .rail-head { padding: 12px 16px 10px; }
    h1 { font-size: 20px; }
    .controls, .item, .status { padding-left: 16px; padding-right: 16px; }
    .item { grid-template-columns: 20px 104px minmax(0, 1fr); }
    .item img { width: 104px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .item, .btn { transition: background-color 0.15s; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="stage">
    <div id="player"></div>
    <button class="show-list" id="showList" type="button">一覧を表示</button>
  </div>

  <aside class="rail" aria-label="再生リスト">
    <div class="rail-head">
      <p class="eyebrow">SORA KAKERU TENMA</p>
      <h1>空駆ける天馬</h1>
    </div>
    <div class="controls">
      <button class="btn" id="prev" type="button">前へ</button>
      <button class="btn" id="next" type="button">次へ</button>
      <button class="btn" id="auto" type="button" aria-pressed="true">自動で次へ</button>
      <button class="btn" id="full" type="button">全画面</button>
      <button class="btn" id="hideList" type="button">一覧を隠す</button>
    </div>
    <ul class="list" id="list"></ul>
    <div class="status" id="status" aria-live="polite"></div>
  </aside>
</div>

<script>
  var VIDEOS = [
    { id: "0XzSTNVGraM", title: "空駆ける天馬", by: "洗足学園音楽大学" },
    { id: "7d7xAr--fLQ", title: "空駆ける天馬 – 個人", by: "koarasama22" }
  ];

  var player = null;
  var index = 0;
  var autoNext = true;

  var listEl = document.getElementById("list");
  var statusEl = document.getElementById("status");
  var appEl = document.getElementById("app");

  VIDEOS.forEach(function (v, i) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.className = "item";
    b.setAttribute("data-i", i);
    b.innerHTML =
      '<span class="no">' + (i + 1) + '</span>' +
      '<img alt="" loading="lazy" src="https://i.ytimg.com/vi/' + v.id + '/mqdefault.jpg">' +
      '<span><span class="t"></span><span class="b"></span></span>';
    b.querySelector(".t").textContent = v.title;
    b.querySelector(".b").textContent = v.by;
    b.addEventListener("click", function () { select(i, true); });
    li.appendChild(b);
    listEl.appendChild(li);
  });

  function renderState() {
    var items = listEl.querySelectorAll(".item");
    for (var i = 0; i < items.length; i++) {
      if (i === index) items[i].setAttribute("aria-current", "true");
      else items[i].removeAttribute("aria-current");
    }
    var next = VIDEOS[(index + 1) % VIDEOS.length];
    statusEl.innerHTML = "<strong></strong> を再生中。次は <span></span>。";
    statusEl.querySelector("strong").textContent = VIDEOS[index].title;
    statusEl.querySelector("span").textContent = autoNext ? next.title : "（自動再生オフ）";
    document.title = VIDEOS[index].title;
  }

  function select(i, play) {
    index = (i + VIDEOS.length) % VIDEOS.length;
    if (player && player.loadVideoById) {
      if (play) player.loadVideoById(VIDEOS[index].id);
      else player.cueVideoById(VIDEOS[index].id);
    }
    renderState();
  }

  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      videoId: VIDEOS[0].id,
      width: "100%",
      height: "100%",
      playerVars: { rel: 0, playsinline: 1 },
      events: {
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.ENDED && autoNext) select(index + 1, true);
        },
        onError: function () {
          statusEl.innerHTML = "この動画を再生できません。<a target=\"_blank\" rel=\"noopener\">YouTubeで開く</a>";
          statusEl.querySelector("a").href = "https://www.youtube.com/watch?v=" + VIDEOS[index].id;
        }
      }
    });
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  document.getElementById("prev").addEventListener("click", function () { select(index - 1, true); });
  document.getElementById("next").addEventListener("click", function () { select(index + 1, true); });

  var autoBtn = document.getElementById("auto");
  autoBtn.addEventListener("click", function () {
    autoNext = !autoNext;
    autoBtn.setAttribute("aria-pressed", String(autoNext));
    renderState();
  });

  function setListHidden(hidden) {
    appEl.classList.toggle("list-hidden", hidden);
  }
  document.getElementById("hideList").addEventListener("click", function () { setListHidden(true); });
  document.getElementById("showList").addEventListener("click", function () { setListHidden(false); });

  document.getElementById("full").addEventListener("click", function () {
    var el = document.documentElement;
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  });

  document.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === "n" || e.key === "N") select(index + 1, true);
    if (e.key === "p" || e.key === "P") select(index - 1, true);
    if (e.key === "l" || e.key === "L") setListHidden(!appEl.classList.contains("list-hidden"));
  });

  renderState();

  var s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
</script>
</body>
</html>
